name: Test installers

on:
  push:
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/test-install.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            kind: unix
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            kind: unix
          - name: macos-aarch64
            os: macos-latest
            kind: unix
          - name: windows-powershell
            os: windows-latest
            kind: pwsh
          - name: windows-cmd
            os: windows-latest
            kind: cmd

    steps:
      - uses: actions/checkout@v4

      - name: Install (Unix)
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          command -v supercharge
          supercharge --version
          sc --version

      - name: Install (Windows PowerShell)
        if: matrix.kind == 'pwsh'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\install.ps1
          $cmd = Get-Command supercharge.exe -ErrorAction Stop
          Write-Host "Resolved: $($cmd.Source)"
          & supercharge.exe --version
          # `sc` is Set-Content in PowerShell; the CLI is sc.exe
          & sc.exe --version

      - name: Install (Windows cmd)
        if: matrix.kind == 'cmd'
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1
          if errorlevel 1 exit /b 1
          set "PATH=%USERPROFILE%\.local\bin;%PATH%"
          supercharge.exe --version
          if errorlevel 1 exit /b 1
          sc.exe --version
          if errorlevel 1 exit /b 1
          where supercharge
